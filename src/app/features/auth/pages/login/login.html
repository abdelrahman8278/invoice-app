<form [formGroup]="loginForm" (ngSubmit)="login()" style="width:300px; margin:auto; padding-top:50px;">
      <mat-form-field appearance="outline" style="width:100%;">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username">
      </mat-form-field>

      <mat-form-field appearance="outline" style="width:100%;">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password">
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" style="width:100%; margin-top:10px;">
        Login
      </button>
    </form>
