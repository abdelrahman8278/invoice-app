
    <div class="login-card">
  <h4 class="login-title mb-3 text-center">Welcome Back 👋</h4>
  <p class="text-muted text-center mb-4">Please log in to Invoice</p>

  <form [formGroup]="loginForm" (ngSubmit)="login()">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <div class="input-group">
        <input type="email" class="form-control" placeholder="username@example.com" formControlName="username" >
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <div class="input-group">
        <input type="password" class="form-control" placeholder="••••••••" formControlName="password">
      </div>
    </div>

    <div class="d-flex justify-content-between mb-3">
      <div>
        <input type="checkbox" id="remember">
        <label for="remember" class="mx-2">Remember me</label>
      </div>
      <a href="#" class="text-primary text-decoration-none">Forgot password?</a>
    </div>

    <button class="btn btn-primary w-100 py-2" type="submit">Login</button>

    <p class="text-center mt-4 mb-0">
      Don't have an account? <a href="#" class="text-primary">Sign up</a>
    </p>
  </form>
</div>
